name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang libclang-dev
      - name: Test all targets and features
        run: cargo test --locked --all-targets --all-features
