[package]
name = "hyperlicked"
version = "0.1.0"
edition = "2021"
description = "Hyperlicked - high-performance perpetual futures exchange"

[features]
default = ["bls_batch_verify"]
parallel_matching = ["rayon"]
incremental_hash = []
bls_batch_verify = []

[[bin]]
name = "hl-node"
path = "src/bin/node.rs"

[[bin]]
name = "multinode"
path = "src/bin/multinode.rs"

[[bin]]
name = "hl-server"
path = "src/bin/server.rs"

[[bin]]
name = "hl-visor"
path = "src/bin/visor.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Environment
dotenvy = "0.15"

# Crypto
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
alloy-primitives = { version = "0.8", features = ["serde"] }
alloy-sol-types = "0.8"
k256 = { version = "0.13", features = ["ecdsa"] }
blst = "0.3"
getrandom = "0.2"

# HTTP/WebSocket
axum = { version = "0.7", features = ["ws"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"
reqwest = { version = "0.12", features = ["json"] }

# Dependencies to add later:
# ethers = "2.0"              # EIP-712 signing
# blst = "0.3"                # BLS signatures
# libp2p = "0.54"             # P2P networking
rocksdb = "0.22"              # Storage
base64 = "0.22.1"

# Parallelism
rayon = { version = "1.10", optional = true }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Visor dependencies
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
dirs = "5.0"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.10"
